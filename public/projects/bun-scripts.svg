f" font-weight="400" xml:space="preserve"></text><text x="158" y="394" font-family="monospace" font-size="14" fill="#e3e7e9" font-weight="400" xml:space="preserve">$ r</text><text x="158" y="429" font-family="monospace" font-size="14" fill="#8d9da3" font-weight="400" xml:space="preserve">  Search workspace scripts</text><text x="158" y="464" font-family="monospace" font-size="14" fill="#bcd4b6" font-weight="400" xml:space="preserve">  &gt; web:dev</text><text x="158" y="499" font-family="monospace" font-size="14" fill="#8d9da3" font-weight="400" xml:space="preserve">    web:build</text><text x="158" y="534" font-family="monospace" font-size="14" fill="#8d9da3" font-weight="400" xml:space="preserve">    tools:typecheck</text><rect x="158" y="590" width="8" height="18" rx="0" fill="#d1d7ac" stroke="none"/></g></svg>