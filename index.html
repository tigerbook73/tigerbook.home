<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="Tigerbook's projects: useful little tools, web experiences, and experiments. Explore the work, peek at the code, and try something new." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tigerbook's Projects Page" />
    <meta property="og:description" content="A collection of things I build. Useful tools, web experiences, and experiments." />
    <meta property="og:url" content="https://www.tigerbook.top/" />
    <meta property="og:image" content="https://www.tigerbook.top/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://www.tigerbook.top/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tigerbook's Projects Page</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('tigerbook-theme'); } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#111315' : '#f7f8fa';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This project gallery needs JavaScript. You can also explore the projects at <a href="https://github.com/tigerbook73">github.com/tigerbook73</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
